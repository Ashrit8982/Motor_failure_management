<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial IoT — Failure Management Dashboard</title>
    <meta name="description" content="Real-time predictive maintenance monitoring dashboard for Industrial IoT systems">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                    mono: ['JetBrains Mono', 'monospace'],
                },
                colors: {
                    dark: { 900: '#0a0e1a', 800: '#111827', 700: '#1e293b', 600: '#334155' },
                }
            }
        }
    }
    </script>
    <style>
        body { background: #0a0e1a; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17,24,39,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); }
        .glass:hover { border-color: rgba(255,255,255,0.12); }
        .glow-green { box-shadow: 0 0 20px rgba(16,185,129,0.15); }
        .glow-red { box-shadow: 0 0 30px rgba(239,68,68,0.2); }
        .glow-blue { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
        @keyframes pulse-slow { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
        @keyframes slideDown { from{transform:translateY(-100%);opacity:0} to{transform:translateY(0);opacity:1} }
        .slide-down { animation: slideDown 0.4s ease; }
        @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .flash { animation: flash 1s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
</head>
<body class="dark text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Emergency Alarm Audio Engine ───
        var alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
        var alarmInterval = null;

        function startAlarm() {
            if (alarmInterval) return;
            if (alarmCtx.state === 'suspended') alarmCtx.resume();
            function siren() {
                var now = alarmCtx.currentTime;
                var osc = alarmCtx.createOscillator();
                var gain = alarmCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(800, now + 0.25);
                osc.connect(gain);
                gain.connect(alarmCtx.destination);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
            siren();
            alarmInterval = setInterval(siren, 1000);
        }

        function stopAlarm() {
            if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
        }

        // ─── Chart Component (Persistent — updates in-place for smooth real-time) ───
        function LineChart({ data, labels, color1, label, unit, minY, maxY }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 200);
                gradient.addColorStop(0, color1 + '30');
                gradient.addColorStop(1, color1 + '02');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: label,
                            data: [],
                            borderColor: color1,
                            backgroundColor: gradient,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: color1,
                            pointBorderColor: 'transparent',
                            pointHoverRadius: 7,
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: color1,
                            pointHoverBorderWidth: 3,
                            borderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 400, easing: 'easeOutQuart' },
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                enabled: true,
                                backgroundColor: 'rgba(15,23,42,0.95)',
                                borderColor: color1 + '66',
                                borderWidth: 1,
                                padding: 12,
                                cornerRadius: 8,
                                titleFont: { family: 'Inter', size: 11, weight: '600' },
                                titleColor: '#94a3b8',
                                bodyFont: { family: 'JetBrains Mono', size: 14, weight: '700' },
                                bodyColor: '#f1f5f9',
                                footerFont: { family: 'JetBrains Mono', size: 10 },
                                footerColor: '#64748b',
                                displayColors: false,
                                callbacks: {
                                    title: function(items) { return 'Time: ' + items[0].label; },
                                    label: function(ctx) {
                                        var precision = (unit === 'g') ? 4 : 1;
                                        return label + ': ' + ctx.parsed.y.toFixed(precision) + ' ' + unit;
                                    },
                                    afterLabel: function(ctx) {
                                        var idx = ctx.dataIndex;
                                        var arr = ctx.dataset.data;
                                        if (idx > 0) {
                                            var diff = arr[idx] - arr[idx - 1];
                                            var sign = diff >= 0 ? '+' : '';
                                            var precision = (unit === 'g') ? 4 : 2;
                                            return 'Change: ' + sign + diff.toFixed(precision) + ' ' + unit;
                                        }
                                        return '';
                                    }
                                }
                            },
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Time', color: '#475569', font: { family: 'Inter', size: 10, weight: '500' }, padding: { top: 4 } },
                                grid: { color: 'rgba(255,255,255,0.03)' },
                                ticks: { color: '#475569', font: { size: 9, family: 'JetBrains Mono' }, maxTicksLimit: 8, maxRotation: 0 },
                                border: { display: false },
                            },
                            y: {
                                title: { display: true, text: label + ' (' + unit + ')', color: '#475569', font: { family: 'Inter', size: 10, weight: '500' }, padding: { bottom: 4 } },
                                min: minY, max: maxY,
                                grid: { color: 'rgba(255,255,255,0.03)' },
                                ticks: { color: '#475569', font: { size: 10, family: 'JetBrains Mono' } },
                                border: { display: false },
                            }
                        }
                    },
                    plugins: [{
                        id: 'verticalLine',
                        afterDraw: function(chart) {
                            if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
                                var x = chart.tooltip._active[0].element.x;
                                var yAxis = chart.scales.y;
                                var ctx = chart.ctx;
                                ctx.save();
                                ctx.beginPath();
                                ctx.setLineDash([4, 4]);
                                ctx.moveTo(x, yAxis.top);
                                ctx.lineTo(x, yAxis.bottom);
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = color1 + '55';
                                ctx.stroke();
                                ctx.restore();
                            }
                        }
                    }]
                });

                return function() { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
            }, []);

            useEffect(() => {
                if (!chartRef.current) return;
                chartRef.current.data.labels = labels;
                chartRef.current.data.datasets[0].data = data;
                chartRef.current.update('default');
            }, [data, labels]);

            return <canvas ref={canvasRef} style={{ cursor: 'crosshair' }} />;
        }

        // ─── Sensor Card ───
        function SensorCard({ title, value, unit, zscore, calibrated, icon, gradient, danger }) {
            return (
                <div className={`glass rounded-2xl p-5 transition-all duration-300 hover:-translate-y-0.5 relative overflow-hidden ${danger ? 'glow-red border-red-500/40 flash' : ''}`}>
                    <div className={`absolute top-0 left-0 right-0 h-1 ${gradient}`}></div>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-medium uppercase tracking-wider text-gray-400">{title}</span>
                        <span className="text-gray-500">{icon}</span>
                    </div>
                    <div className="flex items-baseline gap-1 mb-2">
                        <span className="text-3xl font-bold font-mono">{value !== null ? value : '--'}</span>
                        <span className="text-sm text-gray-400">{unit}</span>
                    </div>
                    <div className="flex items-center justify-between">
                        <span className="text-xs text-gray-500">
                            {calibrated ? 'AI Monitoring Active' : 'Calibrating...'}
                        </span>
                        {calibrated && zscore !== undefined && (
                            <span className={`font-mono text-xs font-semibold px-2 py-0.5 rounded-full ${
                                zscore > 2.5 ? 'bg-red-500/15 text-red-400 animate-pulse-slow' :
                                zscore > 1.5 ? 'bg-amber-500/15 text-amber-400' :
                                'bg-blue-500/10 text-blue-400'
                            }`}>
                                Z: {zscore.toFixed(1)}
                            </span>
                        )}
                    </div>
                </div>
            );
        }

        // ─── Health Score ───
        function HealthScore({ score, calibrated }) {
            var color = score > 70 ? 'text-emerald-400' : score > 40 ? 'text-amber-400' : 'text-red-400';
            var bg = score > 70 ? 'from-emerald-500 to-emerald-600' : score > 40 ? 'from-amber-500 to-amber-600' : 'from-red-500 to-red-600';
            var statusLabel = score > 70 ? 'Healthy' : score > 40 ? 'Warning' : 'Critical';

            return (
                <div className="glass rounded-2xl p-5 relative overflow-hidden">
                    <div className={`absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${bg}`}></div>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-medium uppercase tracking-wider text-gray-400">AI Health Score</span>
                        <span className="text-gray-500">🧠</span>
                    </div>
                    <div className="flex items-baseline gap-1 mb-2">
                        <span className={`text-4xl font-black font-mono ${color}`}>
                            {calibrated ? Math.round(score) : '--'}
                        </span>
                        <span className="text-sm text-gray-400">%</span>
                    </div>
                    <div className="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden mb-2">
                        <div className={`h-full rounded-full bg-gradient-to-r ${bg} transition-all duration-700`}
                             style={{ width: (calibrated ? score : 0) + '%' }}></div>
                    </div>
                    <span className={`text-xs font-medium ${color}`}>
                        {calibrated ? statusLabel : 'Waiting for calibration...'}
                    </span>
                </div>
            );
        }

        // ─── Motor Status ───
        function MotorStatus({ running, fault, reason, onReset }) {
            return (
                <div className={`glass rounded-2xl p-5 relative overflow-hidden ${!running ? 'glow-red' : 'glow-green'}`}>
                    <div className={`absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${running ? 'from-emerald-500 to-emerald-600' : 'from-red-500 to-red-600'}`}></div>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-medium uppercase tracking-wider text-gray-400">Motor Status</span>
                        <span className={`text-xl ${running ? 'animate-spin' : ''}`} style={{animationDuration:'2s'}}>⚙️</span>
                    </div>
                    <div className="flex items-center gap-3 mb-2">
                        <div className={`w-3 h-3 rounded-full ${running ? 'bg-emerald-400' : 'bg-red-400 animate-pulse-slow'}`}></div>
                        <span className={`text-2xl font-bold ${running ? 'text-emerald-400' : 'text-red-400'}`}>
                            {running ? 'RUNNING' : 'STOPPED'}
                        </span>
                    </div>
                    <p className="text-xs text-gray-500 mb-3">
                        {fault ? reason || 'System fault detected' : 'No faults detected'}
                    </p>
                    {!running && (
                        <button onClick={onReset}
                            className="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-bold text-sm hover:shadow-lg hover:shadow-emerald-500/25 transition-all hover:-translate-y-0.5 active:translate-y-0">
                            ✅ Restart Machine
                        </button>
                    )}
                </div>
            );
        }

        // ─── Calibration Bar ───
        function CalibrationBar({ calibrated, progress, total }) {
            if (calibrated) {
                return (
                    <div className="glass rounded-xl px-5 py-3 flex items-center gap-3 glow-green">
                        <span className="text-lg">✅</span>
                        <span className="text-sm font-semibold text-emerald-400">AI Model Calibrated &amp; Ready</span>
                    </div>
                );
            }
            var pct = Math.min(100, Math.round((progress / total) * 100));
            return (
                <div className="glass rounded-xl px-5 py-3 glow-blue">
                    <div className="flex items-center gap-3 mb-2">
                        <span className="text-lg animate-pulse">🧠</span>
                        <div className="flex-1">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-sm font-semibold text-purple-400">Calibrating AI Model...</span>
                                <span className="text-xs font-mono text-purple-300">{progress}/{total}</span>
                            </div>
                            <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                                <div className="h-full rounded-full bg-gradient-to-r from-purple-500 to-cyan-400 transition-all duration-500"
                                     style={{ width: pct + '%' }}></div>
                            </div>
                        </div>
                        <span className="text-xs font-mono font-bold text-purple-300">{pct}%</span>
                    </div>
                </div>
            );
        }

        // ─── Alert Banner ───
        function AlertBanner({ fault, reason, onDismiss }) {
            if (!fault) return null;
            return (
                <div className="fixed top-0 left-0 right-0 z-50 slide-down">
                    <div className="bg-gradient-to-r from-red-600/95 to-red-700/95 backdrop-blur-xl border-b-2 border-red-500 px-6 py-3 flex items-center gap-4 flash"
                         style={{boxShadow:'0 4px 40px rgba(239,68,68,0.4)'}}>
                        <span className="text-2xl">🚨</span>
                        <div className="flex-1">
                            <p className="font-bold text-sm uppercase tracking-wider">Critical Machine Fault</p>
                            <p className="text-xs text-red-100 font-mono">{reason || 'Unknown fault'}</p>
                        </div>
                        <button onClick={onDismiss} className="px-4 py-1.5 border border-white/30 rounded-lg text-xs font-bold hover:bg-white/10 transition-colors">
                            DISMISS
                        </button>
                    </div>
                </div>
            );
        }

        // ─── Error Log ───
        function ErrorLog({ logs }) {
            return (
                <div className="glass rounded-2xl overflow-hidden">
                    <div className="px-5 py-3 border-b border-white/5 flex items-center justify-between">
                        <h3 className="text-sm font-semibold">🔔 Fault Log</h3>
                        <span className="text-xs font-mono bg-red-500/10 text-red-400 px-2 py-0.5 rounded-full">
                            {logs.length} event{logs.length !== 1 ? 's' : ''}
                        </span>
                    </div>
                    <div className="max-h-64 overflow-y-auto p-4 space-y-2">
                        {logs.length === 0 ? (
                            <p className="text-center text-gray-500 text-sm py-6">No faults recorded</p>
                        ) : (
                            [...logs].reverse().map(function(log, i) {
                                return (
                                    <div key={i} className="flex items-start gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5">
                                        <span className="text-sm">🚨</span>
                                        <div className="flex-1 min-w-0">
                                            <p className="text-xs font-semibold text-red-400 truncate">{log.reason}</p>
                                            <p className="text-[10px] font-mono text-gray-500 mt-0.5">
                                                T={log.temperature ? log.temperature.toFixed(1) : '?'}°C | H={log.humidity ? log.humidity.toFixed(1) : '?'}% | V={log.vibration ? log.vibration.toFixed(3) : '?'}g
                                            </p>
                                        </div>
                                        <span className="text-[10px] font-mono text-gray-600 whitespace-nowrap">{log.timestamp}</span>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // ─── Chart Card ───
        function ChartCard({ title, data, labels, color, unit, badge, minY, maxY }) {
            var latestVal = data.length > 0 ? data[data.length - 1] : null;
            var precision = (unit === 'g') ? 3 : 1;
            return (
                <div className="glass rounded-2xl p-5">
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                            <h3 className="text-sm font-semibold">📊 {title}</h3>
                            {latestVal !== null && (
                                <span className="text-xs font-mono text-gray-400 bg-white/5 px-2 py-0.5 rounded">
                                    {latestVal.toFixed(precision)} {unit}
                                </span>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] text-gray-500 font-mono">{data.length} pts</span>
                            <span className={`text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                                badge === 'rising' ? 'bg-amber-500/10 text-amber-400' :
                                badge === 'falling' ? 'bg-blue-500/10 text-blue-400' :
                                'bg-emerald-500/10 text-emerald-400'
                            }`}>
                                {badge === 'rising' ? '↑ Rising' : badge === 'falling' ? '↓ Falling' : '— Stable'}
                            </span>
                        </div>
                    </div>
                    <div style={{ height: '190px' }}>
                        <LineChart data={data} labels={labels} color1={color} label={title} unit={unit} minY={minY} maxY={maxY} />
                    </div>
                    <div className="flex justify-between mt-2 text-[10px] font-mono text-gray-600">
                        <span>Min: {data.length > 0 ? Math.min.apply(null, data).toFixed(precision) : '--'}</span>
                        <span>Avg: {data.length > 0 ? (data.reduce(function(a,b){return a+b},0)/data.length).toFixed(precision) : '--'}</span>
                        <span>Max: {data.length > 0 ? Math.max.apply(null, data).toFixed(precision) : '--'}</span>
                    </div>
                </div>
            );
        }

        // ─── Main App ───
        function App() {
            const [data, setData] = useState(null);
            const [history, setHistory] = useState([]);
            const [logs, setLogs] = useState([]);
            const [alertDismissed, setAlertDismissed] = useState(false);
            const [connected, setConnected] = useState(false);
            const prevFaultRef = useRef(false);

            var fetchData = useCallback(async function() {
                try {
                    var res = await fetch('/api/latest');
                    var json = await res.json();
                    if (json.latest && Object.keys(json.latest).length > 0) {
                        setData(json.latest);
                        setHistory(json.history || []);
                        setConnected(true);
                        if (!json.latest.system_fault) { setAlertDismissed(false); stopAlarm(); }
                        if (json.latest.system_fault && !prevFaultRef.current) { startAlarm(); }
                        prevFaultRef.current = json.latest.system_fault || false;
                    }
                } catch (e) { setConnected(false); }
            }, []);

            var fetchLogs = useCallback(async function() {
                try {
                    var res = await fetch('/api/logs');
                    var json = await res.json();
                    setLogs(json.logs || []);
                } catch (e) {}
            }, []);

            useEffect(function() {
                fetchData();
                fetchLogs();
                var i1 = setInterval(fetchData, 2000);
                var i2 = setInterval(fetchLogs, 5000);
                return function() { clearInterval(i1); clearInterval(i2); };
            }, [fetchData, fetchLogs]);

            var handleReset = async function() {
                try { await fetch('/api/reset', { method: 'POST' }); } catch (e) {}
            };

            var d = data || {};
            var calibrated = d.calibrated || false;
            var healthScore = calibrated
                ? Math.max(0, 100 - ((d.vib_zscore + d.temp_zscore + (d.humi_zscore || 0)) / 3) * 30)
                : 0;

            var tempData = history.map(function(h) { return h.temperature; });
            var humiData = history.map(function(h) { return h.humidity || 0; });
            var vibData = history.map(function(h) { return h.vibration; });
            var timeLabels = history.map(function(h) { return h.timestamp || ''; });

            var getTrend = function(arr) {
                if (arr.length < 10) return 'stable';
                var recent = arr.slice(-5).reduce(function(a,b){return a+b},0)/5;
                var older = arr.slice(-10,-5).reduce(function(a,b){return a+b},0)/5;
                var change = ((recent-older)/(older||1))*100;
                return Math.abs(change) < 3 ? 'stable' : change > 0 ? 'rising' : 'falling';
            };

            var uptime = d.uptime || 0;
            var hrs = Math.floor(uptime/3600);
            var min = Math.floor((uptime%3600)/60);
            var sec = uptime%60;
            var uptimeStr = String(hrs).padStart(2,'0') + ':' + String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');

            return (
                <div className="min-h-screen">
                    {d.system_fault && !alertDismissed && (
                        <AlertBanner fault={true} reason={d.fault_reason} onDismiss={function() { setAlertDismissed(true); stopAlarm(); }} />
                    )}

                    <header className="sticky top-0 z-40 glass border-b border-white/5 px-6 py-3">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-cyan-400 text-xl">⚡</span>
                                <div>
                                    <h1 className="text-sm font-bold bg-gradient-to-r from-gray-100 to-gray-400 bg-clip-text text-transparent">
                                        Failure Management System
                                    </h1>
                                    <p className="text-[10px] text-gray-500 uppercase tracking-widest">Industrial IoT — Predictive Maintenance</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border ${
                                    connected ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400' : 'border-red-500/20 bg-red-500/10 text-red-400'
                                }`}>
                                    <div className={`w-2 h-2 rounded-full ${connected ? 'bg-emerald-400' : 'bg-red-400'}`}></div>
                                    {connected ? 'ESP32 Online' : 'Disconnected'}
                                </div>
                                <div className="text-xs font-mono text-gray-500 bg-white/[0.03] border border-white/5 px-3 py-1.5 rounded-full">
                                    ⏱ {uptimeStr}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 py-6 space-y-5">
                        <CalibrationBar calibrated={calibrated} progress={d.calibration_progress || 0} total={d.calibration_total || 100} />

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                            <SensorCard title="Temperature" value={d.temperature ? d.temperature.toFixed(1) : null} unit="°C"
                                zscore={d.temp_zscore} calibrated={calibrated}
                                icon="🌡️" gradient="bg-gradient-to-r from-orange-500 to-red-500"
                                danger={d.temp_zscore > 3} />
                            <SensorCard title="Humidity" value={d.humidity ? d.humidity.toFixed(1) : null} unit="%"
                                zscore={d.humi_zscore} calibrated={calibrated}
                                icon="💧" gradient="bg-gradient-to-r from-purple-500 to-violet-500" />
                            <SensorCard title="Vibration" value={d.vibration ? d.vibration.toFixed(3) : null} unit="g"
                                zscore={d.vib_zscore} calibrated={calibrated}
                                icon="📳" gradient="bg-gradient-to-r from-cyan-500 to-blue-500"
                                danger={d.vib_zscore > 3} />
                            <HealthScore score={healthScore} calibrated={calibrated} />
                            <MotorStatus running={d.motor_running !== false}
                                fault={d.system_fault} reason={d.fault_reason}
                                onReset={handleReset} />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <ChartCard title="Temperature" data={tempData} labels={timeLabels}
                                color="#f97316" unit="°C" badge={getTrend(tempData)} minY={0} maxY={60} />
                            <ChartCard title="Humidity" data={humiData} labels={timeLabels}
                                color="#8b5cf6" unit="%" badge={getTrend(humiData)} minY={0} maxY={100} />
                            <ChartCard title="Vibration" data={vibData} labels={timeLabels}
                                color="#06b6d4" unit="g" badge={getTrend(vibData)} minY={0} maxY={4} />
                        </div>

                        <ErrorLog logs={logs} />
                    </main>

                    <footer className="text-center py-6 text-[10px] text-gray-600 border-t border-white/5 mt-4">
                        Industrial IoT Failure Management System — ESP32 + MPU6050 + DHT22 + AI/ML Anomaly Detection
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
